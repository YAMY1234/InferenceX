name: "agg-gb300-tp8-c1-mtp-lowlatency"

# AgentX low-latency aggregate topology: one TP8 worker spans two
# four-GPU GB300 nodes. The batch-one contract is intentionally narrow and
# must not be reused for DP-attention, expert-parallel, or multi-request lanes.

model:
  path: "qwen3.5-fp4"
  container: "dynamo-sglang"
  precision: "fp4"

identity:
  model:
    repo: "nvidia/Qwen3.5-397B-A17B-NVFP4-V2"
  container:
    image: "lmsysorg/sglang:nightly-dev-cu13-20260821-f825d729"
  frameworks:
    dynamo: "1.4.0"

dynamo:
  install: true
  wheel: "1.4.0"

health_check:
  max_attempts: 1440
  interval_seconds: 10

resources:
  gpu_type: "gb300"
  gpus_per_node: 4
  agg_nodes: 2
  agg_workers: 1
  gpus_per_agg: 8

infra:
  nats_max_payload_mb: 8

frontend:
  type: dynamo
  enable_multiple_frontends: false
  env:
    DYN_NATS_REQUEST_TIMEOUT_SECS: "1800"
  args:
    router-mode: "kv"
    router-session-affinity-ttl-secs: "3600"
    active-decode-blocks-threshold: "None"
    active-prefill-tokens-threshold: "None"
    active-prefill-tokens-threshold-frac: "None"

backend:
  type: sglang
  aggregated_environment:
    PYTHONNOUSERSITE: "1"
    NCCL_CUMEM_ENABLE: "1"
    NCCL_MNNVL_ENABLE: "1"
    NCCL_NVLS_ENABLE: "0"
    MC_FORCE_MNNVL: "1"
    SGLANG_ENABLE_FLASHINFER_GEMM: "true"
    SGLANG_ENABLE_SPEC_V2: "1"
    SGLANG_ENABLE_JIT_DEEPGEMM: "true"
    # The pinned 2026-08-21 image predates SGLang #36568. Remove this override
    # when the recipe is repinned to a nightly containing the DP1 default.
    SGLANG_SCHEDULER_SKIP_ALL_GATHER: "1"
    TORCH_CUDA_ARCH_LIST: "10.0"
  sglang_config:
    aggregated:
      served-model-name: "nvidia/Qwen3.5-397B-A17B-NVFP4-V2"
      model-path: "/model/"
      trust-remote-code: true
      tensor-parallel-size: 8
      pipeline-parallel-size: 1
      data-parallel-size: 1
      expert-parallel-size: 1
      moe-dense-tp-size: 8
      enable-dp-attention: false
      enable-dp-lm-head: false
      moe-a2a-backend: "none"
      quantization: "modelopt_fp4"
      fp4-gemm-backend: "flashinfer_cutlass"
      kv-cache-dtype: "fp8_e4m3"
      mamba-ssm-dtype: "bfloat16"
      mamba-radix-cache-strategy: "extra_buffer"
      mamba-track-interval: 8192
      mamba-max-states-per-path: 3
      attention-backend: "trtllm_mha"
      linear-attn-decode-backend: "triton"
      moe-runner-backend: "flashinfer_cutedsl"
      disable-shared-experts-fusion: true
      speculative-algorithm: "NEXTN"
      speculative-num-steps: 6
      speculative-eagle-topk: 1
      speculative-num-draft-tokens: 7
      speculative-moe-runner-backend: "flashinfer_cutedsl"
      speculative-moe-a2a-backend: "none"
      enable-linear-replayssm-spec: true
      disable-attn-tp-gather: true
      max-running-requests: 1
      cuda-graph-max-bs-decode: 1
      cuda-graph-bs-decode: [1]
      max-prefill-tokens: 8192
      chunked-prefill-size: 8192
      mem-fraction-static: 0.85
      max-mamba-cache-size: 1536
      page-size: 64
      stream-interval: 20
      scheduler-recv-interval: 10
      watchdog-timeout: 1000000
      enable-hierarchical-cache: true
      hicache-size: 32
      hicache-write-policy: "write_back"
      hicache-io-backend: "kernel"
      hicache-mem-layout: "page_first_direct"
      enable-metrics: true
      enable-cache-report: true

sbatch_directives:
  mem: "0"
  cpus-per-task: "144"

srun_options:
  mem: "0"
  container-remap-root: ""

benchmark:
  type: custom
  command: bash /infmax-workspace/benchmarks/multi_node/agentic_srt.sh
  env:
    INFMAX_CONTAINER_WORKSPACE: "/infmax-workspace"
    RESULT_DIR: "/logs/agentic"
    PORT: "8000"
    IS_MULTINODE: "false"
    TP: "8"
    AIPERF_HTTP_X_DYNAMO_SESSION_ID_FROM_CORRELATION_ID: "true"
    AIPERF_USE_DYNAMO_CONV_AWARE_ROUTING: "0"
    AIPERF_REQUIRED_SERVER_METRIC_PREFIX: "sglang:"
    AIPERF_DATASET_MMAP_CACHE_DIR: "/aiperf_mmap_cache"
    HF_HUB_CACHE: "/hf_hub_cache"
