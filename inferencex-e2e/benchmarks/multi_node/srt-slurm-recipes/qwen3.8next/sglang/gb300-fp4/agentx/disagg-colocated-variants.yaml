# 1 prefill + 2 decode workers, TP1 each, on one node (3 GPUs); the decode workers take the node's highest free GPUs.
override_c160-1p2d-stack-fp8host:
  name: qwen3.8next-fp4-gb300-dynamo-sglang-agentx-c160-1p2d-stack-fp8host
  resources:
    spread_workers: true
  roles:
    prefill:
      env:
        SGLANG_QWEN_MOE_FUSED_FINALIZE_GATE_MAX_TOKENS: '16384'
      args:
        hicache-size: 165
        chunked-prefill-size: 16384
        max-prefill-tokens: 16384
        weight-loader-drop-cache-after-load: true
    decode:
      args:
        max-mamba-cache-size: 416

# 2 prefill + 2 decode workers, TP1 each, on one node (4 GPUs); the full prefill stack. Concurrency 256 and 320.
override_2p2d-prefill-stack-full-fp8host:
  name: qwen3.8next-fp4-gb300-dynamo-sglang-agentx-2p2d-prefill-stack-full-fp8host
