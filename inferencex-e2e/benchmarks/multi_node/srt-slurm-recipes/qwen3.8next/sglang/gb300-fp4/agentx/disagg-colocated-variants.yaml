# Qwen3.8-Flash-Next NVFP4 on GB300: TP1 prefill and TP1 decode workers colocated on one 4-GPU node, Dynamo KV
# router, Mooncake KV transfer, HiCache on the prefill workers (165 GB host pool at 1P2D, 150 GB at 2P2D).
# The VR200 disagg-colocated recipe with the GB300 changes: smaller hicache-size, the GB300 BF16 GEMM pins, no
# FlashInfer MoE tactic pins or Rubin CuTe MoE prefill, FLASHINFER_TOPK_ALGO=default, decode post-verify CUDA
# graph and late join off, and the GB300 prefill / HC knobs.
# HiCache sizes fit InferenceX's per-worker host memory limit on gb300-nv (230000 MiB per TP1 worker): the
# pinned per-layer embedding table (47.7 GiB), the host KV / Mamba pools and the process. 165 GB is the most that
# fits; at 170 SGLang's own host-memory check fails.
schema: 2

