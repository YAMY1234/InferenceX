    exclusive: ''
  srun_options:
    mem: '0'
    container-remap-root: ''
  benchmark:
    env:
      AIPERF_REQUIRED_SERVER_METRIC_PREFIX: 'sglang:'
      KV_OFFLOADING: none

# Concurrency 2: two requests decode, KV cache on the GPU.
override_c2-cap2:
  name: qwen3.8next-fp4-gb300-sglang-agentx-c2-cap2
  roles:
    agg:
      args:
        cuda-graph-max-bs-decode: 4
        cuda-graph-bs-decode: [1, 2, 3, 4]
        prefill-decode-interval: 160
  benchmark:
    env:
      CONC: '2'

# Concurrency 8: running cap 2; 40 decode rounds between prefills.
override_c8-cap2-pdi40:
  name: qwen3.8next-fp4-gb300-sglang-agentx-c8-cap2-pdi40
  roles:
    agg:
      args:
        cuda-graph-max-bs-decode: 8
        cuda-graph-bs-decode: [1, 2, 3, 4, 5, 6, 7, 8]
        prefill-decode-interval: 40
  benchmark:
    env:
      CONC: '8'

# Concurrency 10: running cap 2; 40 decode rounds between prefills.
override_c10-cap2-pdi40:
  name: qwen3.8next-fp4-gb300-sglang-agentx-c10-cap2-pdi40
  roles:
    agg:
      args:
        cuda-graph-max-bs-decode: 8
        cuda-graph-bs-decode: [1, 2, 3, 4, 5, 6, 7, 8]
        prefill-decode-interval: 40
  benchmark:
