        SGLANG_QWEN_MOE_NVFP4_PREQUANT_OVERLAP: '1'
        SGLANG_QWEN_MOE_FUSED_FINALIZE_GATE: '1'
        FLASHINFER_ROUTING_FORCE_BLOCK_PER_TOKEN: '0'
        SGLANG_PERFPF_SPF_AGE_ROUNDS: '8'
        SGLANG_PERFPF_SPF_AGE_CAP: '1'
        SGLANG_PERFPF_SPF_CHUNK_MIN_PCT: '50'
        SGLANG_HC_FUSED_COMBINE_MAX_ROWS: '128'
        SGLANG_ENABLE_MULTI_CTA_VERIFY_SAMPLING: '1'
        SGLANG_ENABLE_MROPE_TEXT_DEVICE_POSITIONS: '1'
