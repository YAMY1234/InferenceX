        AUTO_NUMA_BIND: '0'
        HF_HUB_OFFLINE: '1'
        HF_DATASETS_OFFLINE: '1'
        Q38_GDN_NORM_EARLY: '1'
        SGLANG_ENABLE_PP_SPEC: '0'
        Q38_GDN_INPROJ_CONV: '1'
        SGLANG_PLUGINS: q38_shared_down_tgv
        SGLANG_RUST_BUILD_MODE: never
        Q38_QSA_PDL_INDEX: '1'
