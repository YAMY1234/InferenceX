# Qwen3.8-Flash-Next NVFP4 on GB300, aggregated TP1 on one GPU, KV cache on the GPU (no HiCache).
# Image: lmsysorg/sglang:qwen38-fn-gb300-bbbe528 (SGLang qwen38-fn-rubin branch).
base:
  schema: 2
  name: qwen3.8next-fp4-gb300-sglang-agentx
  identity:
    model:
      revision: fc694b54fb0174e0913e6adf86691ef85a4ead47
    container: {}
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  slurm:
    time_limit: '6:00:00'
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  frontend:
    type: sglang
    enable_multiple_frontends: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        NO_COLOR: '1'
