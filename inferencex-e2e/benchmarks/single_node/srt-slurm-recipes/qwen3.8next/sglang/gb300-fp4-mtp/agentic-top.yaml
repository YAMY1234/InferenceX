# Qwen3.8-Flash-Next NVFP4 on GB300, SGLang qwen38-fn-rubin@a89019e (high concurrency).
# One TP1 worker per point; MTP 3 steps; FP8 E4M3 KV on GPU and host; HiCache 241 GB per GPU;
# the prompt is cached on finish (strip-thinking-cache). Concurrency 64 and 72 run the QSA union prefill with one K
# and one V ring stage (SGLANG_QSA_UNION_PREFILL_STAGES_K/V=1), which fits SM103's 227 KB of shared memory.
base:
  schema: 2
  name: qwen3.8next-fp4-gb300-sglang-agentic-mtp-top
  identity:
    model:
      revision: fc694b54fb0174e0913e6adf86691ef85a4ead47
    container: {}
  resources:
    gpu_type: gb300
    gpus_per_node: 4
  slurm:
    time_limit: '6:00:00'
  health_check:
    max_attempts: 1440
    interval_seconds: 5
  frontend:
    type: sglang
    enable_multiple_frontends: false
  engine: sglang
  roles:
    agg:
      nodes: 1
      workers: 1
      gpus: 1
      env:
        PYTHONNOUSERSITE: '1'
        PYTHONUNBUFFERED: '1'
        NO_COLOR: '1'
        MC_FORCE_MNNVL: '1'
        SGLANG_TIMEOUT_KEEP_ALIVE: '1800'
        SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: '100000'
        SGLANG_DISAGGREGATION_WAITING_TIMEOUT: '100000'
        SGLANG_NVFP4_CKPT_FP8_NEXTN_MOE: '0'
        SGLANG_QSA_SPLIT_TOPK: '0'
        SGLANG_Q38C_MK_QSA: '0'
        SGLANG_Q38C_ROUTER_K4: '1'
        SGLANG_Q38C_ROUTER_WIDE: '0'
        SGLANG_NUMA_BIND_V2: '0'
        SGLANG_GDN_TILED_COMMIT: '1'
        Q38_GDN_FRONT: '1'
        Q38_GDN_PDL: '1'
        SGLANG_GDN_FUSED_VERIFY_GLUE: '0'
        FLASHINFER_ROUTING_FORCE_BLOCK_PER_TOKEN: '0'
        SGLANG_QSA_GROUPED_SCORE_MAX_REQUESTS: '144'
        SGLANG_ENABLE_QSA_GROUPED4_VERIFY: '1'
        SGLANG_QSA_GROUPED4_VERIFY_CTAS: '256'
        SGLANG_QSA_DECODE_CTAS_PER_ROW_LEVELS: 1,256
        SGLANG_QWEN_MOE_FUSED_FINALIZE_GATE_MAX_TOKENS: '16384'
        SGLANG_ENABLE_QWEN_MOE_PREFILL_AUTOTUNE: '1'
        SGLANG_CAUSAL_CONV1D_FWD_CONFIG: 8,256,2,2
        SGLANG_ENABLE_QSA_PREFILL_SCALE_FOLD: '1'
        SGLANG_ENABLE_QSA_GROUPED4_VERIFY_CHAIN: '1'
        SGLANG_ENABLE_QSA_GROUPED4_DRAFT_EXTEND: '1'
        SGLANG_ENABLE_EAGLE_POST_VERIFY_CUDA_GRAPH: '1'
        SGLANG_PLB_STREAM_PRIORITY: '-1'
        SGLANG_ENABLE_POST_VERIFY_LATE_JOIN: '1'
        SGLANG_POST_VERIFY_MAX_GRAPH_KEYS: '512'
        SGLANG_Q35MF_EDGE_SPARSE_VERIFY_SAMPLING: '1'
        FLASHINFER_TOPK_ALGO: filtered
        SGLANG_ENABLE_MROPE_TEXT_DEVICE_POSITIONS: '1'
        SGLANG_FORWARD_HELPER_STREAM_PRIORITY: '-1'
        SGLANG_QSA_GROUPED4_VERIFY_PIPELINE_STAGES: '2'
        SGLANG_QSA_GROUPED4_VERIFY_CHAIN_CTAS: '128'
        SGLANG_ENABLE_QSA_PREFILL_FAST_SELECT: '1'
        SGLANG_ENABLE_QSA_TMA_PREFILL: '1'
        SGLANG_ENABLE_QSA_PREFILL_HOST_PATH: '1'
        SGLANG_PERFPF_SPF_AGE_ROUNDS: '3'
        SGLANG_PERFPF_SPF_AGE_CAP: '1'
        SGLANG_PERFPF_SPF_CHUNK_MIN_PCT: '100'
        SGLANG_Q38C_EXTEND_FASTPATH: '1'
        SGLANG_X_HC_EXTEND_MIN_ROWS: '33'
        SGLANG_HC_MIX_SPLITK_MAX_ROWS: '512'
        SGLANG_FUSED_QK_NORM_ROPE_ROWS: '1'
        SGLANG_QSA_PREFILL_SCORER_TC: '1'
        SGLANG_QSA_PREFILL_PACK_ROWS: '1'
        SGLANG_QSA_VERIFY_TOPK: sampled
        SGLANG_QSA_FP8_POOL_VERIFY_UNION_WARPS: '16'
        SGLANG_QSA_FP8_POOL_VERIFY_WS: '1'
        SGLANG_ENABLE_GDN_VERIFY_CONV_RETILE: '1'
        SGLANG_ENABLE_GDN_VERIFY_NORM_RETILE: '1'
        SGLANG_RUST_TREE_CORE_EXTENSION: /sgl-workspace/sglang/python/sglang/srt/mem_cache/rust_tree_core/mem_cache.cpython-312-aarch64-linux-gnu.so
        SGLANG_RUST_TREE_CORE_EXTENSION_SHA256: 603ee3d87214ccd788a249fcaf579c4d0f3b54ed9376caacb11b547e8b9d7ac1
        SGLANG_HICACHE_WRITE_BACK_BATCHED_EVICTION: '1'
        SGLANG_HICACHE_SUBAGENT_HOST_EVICT_FIRST: '1'
        SGLANG_HICACHE_LOAD_BLOCK_QUOTA: '8'
        SGLANG_HICACHE_MAMBA_LOAD_BLOCK_QUOTA: '8'
        SGLANG_HICACHE_BLOCK_QUOTA: '8'
        SGLANG_PLE_FUSED_EXTEND_CONV: '1'
        SGLANG_QSA_PREFILL_FAST_SELECT_WIDE_LOGITS_MB: '256'
        SGLANG_QSA_PREFILL_FAST_SELECT_TOPK: onepass
        SGLANG_GDN_PREFILL_CONV_RETILE: '1'
        SGLANG_ENABLE_Q38_FUSED_ROUTING: '1'
        SGLANG_Q38_FUSED_ROUTING_MAX_ROWS: '512'
        SGLANG_PERFPF_SPF_MATCH_EVERY: '4'
        SGLANG_ENABLE_GDN_PREFILL_FUSED_STATE_COPY: '1'
        SGLANG_ENABLE_GDN_PREFILL_FUSED_TRACK: '1'
        SGLANG_QWEN_MOE_SHARED_NO_CLONE: '1'
        SGLANG_QSA_UNION_PREFILL_OUT_ALIAS: '1'
        SGLANG_QSA_PREFILL_TOPK_BRIDGE_DIRECT: '1'
        SGLANG_PLE_PREFILL_FUSED_GATE: '1'
        SGLANG_HICACHE_MAMBA_SLOT_STATE_ASYNC: '1'
        SGLANG_HICACHE_GROUPED_DEVICE_FREES: '1'
        SGLANG_HC_BOUNDARY_KS_MAX_ROWS: '320'
        SGLANG_Q38C_LOOKUP_NATIVE: '1'
        SGLANG_ENABLE_QSA_MTP_LOOKUP_BATCHED: '1'
        SGLANG_ENABLE_QSA_MTP_CAPTURE_BATCHED: '1'
        SGLANG_ENABLE_Q38_PLE_VERIFY_PREPARE_BATCHED: '1'
        SGLANG_HICACHE_BATCH_COPY_THRESHOLD: '4096'
      args:
        served-model-name: nvidia/Qwen3.8-Flash-Next-NVFP4
        trust-remote-code: true
        quantization: modelopt_mixed
        context-length: 262144
        tensor-parallel-size: 1
        attention-backend: trtllm_mha
        linear-attn-prefill-backend: flashinfer
        linear-attn-decode-backend: flashinfer
        linear-attn-verify-backend: triton
        mamba-ssm-dtype: bfloat16
        mamba-radix-cache-strategy: extra_buffer_lazy
        mamba-track-interval: 262144
        mamba-max-states-per-path: 1
        mem-fraction-static: 0.89
        max-running-requests: 128
        page-size: 64
        chunked-prefill-size: 16384
        schedule-policy: shortest-prefill-first
        max-prefill-tokens: 16384
        moe-runner-backend: flashinfer_trtllm
        disable-shared-experts-fusion: true
        speculative-algorithm: NEXTN
        speculative-num-steps: 3
        speculative-eagle-topk: 1
        speculative-num-draft-tokens: 4
        speculative-moe-runner-backend: flashinfer_trtllm
        cuda-graph-backend-prefill: breakable
        cuda-graph-backend-decode: full
        cuda-graph-max-bs-decode: 128
        cuda-graph-bs-decode:
