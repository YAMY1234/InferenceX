# between prefills from 40 running requests; post-verify CUDA graph off.
override_c144-top-hostckpt-fp8host-mamba40-pdi24-mbs40-nopv:
  name: qwen3.8next-fp4-gb300-sglang-agentx-c144-top-hostckpt-fp8host-mamba40-pdi24-mbs40-nopv
  roles:
    agg:
      env:
        SGLANG_ENABLE_EAGLE_POST_VERIFY_CUDA_GRAPH: '0'
        SGLANG_ENABLE_POST_VERIFY_LATE_JOIN: '0'
        SGLANG_OPT_MAMBA_HOST_ONLY_CHECKPOINT: '1'
        SGLANG_HICACHE_MAMBA_SIZE_GB: '40'
        SGLANG_OPT_MAMBA_HOST_ONLY_CONCURRENT_FETCH: '1'
        SGLANG_OPT_HICACHE_PINNED_INDEX_H2D: '1'
        SGLANG_ENABLE_QSA_DRAFT_EXTEND_UNION: '1'
        SGLANG_ENABLE_GDN_UCACHE_FUSED_CONV: '1'
        SGLANG_ENABLE_SM107_BF16_SMALLM_ROUTES: '1'
        SGLANG_SPEC_ROW_ARGMAX: '1'
        SGLANG_MOE_FINALIZE_GATE_COLUMN_CHUNK: '1024'
        SGLANG_MOE_FINALIZE_GATE_COLUMN_CHUNK_MAX_TOKENS: '384'
        SGLANG_GDN_PREFILL_SYNC_FREE_METADATA: '1'
      args:
        max-mamba-cache-size: 320
        prefill-decode-interval: 24
        prefill-decode-interval-min-bs: 40
  benchmark:
    env:
      CONC: '144'

